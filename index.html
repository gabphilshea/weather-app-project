<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="hero-section">
        <form>
            <input type="text" id="cityInput" placeholder="Enter city"/>
            <button class="submit-button">Find city</button>
        </form>
    </div>
    
    <div class="weather-card">
        <p class="city-name">Naga City</p>
        <p class="city-temperature">28°C</p>
        <p class="city-humidity">Light rain</p>
        <p class="error-message">Please enter city</p>
    </div>
</body>
</html>
